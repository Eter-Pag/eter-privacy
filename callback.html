<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Eter Publisher - Conexion con TikTok</title>
<style>body{font-family:system-ui,sans-serif;max-width:520px;margin:15vh auto;padding:0 20px;text-align:center;color:#222}small{color:#666}</style>
</head>
<body>
<h2>Conectando con Eter Publisher...</h2>
<p id="msg">Un momento, te estamos regresando a tu aplicacion.</p>
<small>Si no pasa nada, vuelve a Eter Publisher e intenta conectar de nuevo.</small>
<script>
  // Esta pagina solo reenvia el resultado de la autorizacion de TikTok a la app.
  // El prefijo del parametro "state" indica el destino:
  //   "local." -> la app en tu PC (127.0.0.1:8000)
  //   "cloud." (o cualquier otro) -> la app en Railway
  // No guarda nada.
  var CLOUD = "https://dedika-app.up.railway.app";
  var LOCAL = "http://127.0.0.1:8000";
  var q = window.location.search || "";
  var state = new URLSearchParams(q).get("state") || "";
  var base = state.indexOf("local.") === 0 ? LOCAL : CLOUD;
  window.location.replace(base + "/api/tiktok/callback" + q);
</script>
</body>
</html>
